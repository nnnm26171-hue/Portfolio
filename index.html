<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <canvas id="spark-canvas"></canvas>
  <div class="grain-overlay"></div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div id="cursor-dot"></div>
  <div id="cursor-outline"></div>
  <div id="cursor-glow"></div>
  
  <!-- Shooting Stars -->
  <div class="shooting-star star-1"></div>
  <div class="shooting-star star-2"></div>
  <div class="shooting-star star-3"></div>

  <nav class="navbar">
    <div class="nav-right-group">
      <div class="nav-links">
        <a href="#home" onclick="showSection('home'); return false;">Home</a>
        <a href="#experience" onclick="showSection('experience'); return false;">Experience</a>
        <a href="#selfdev" onclick="showSection('selfdev'); return false;">Skills</a>
        <a href="#awards" onclick="showSection('awards'); return false;">Awards</a>
        <a href="#leadership" onclick="showSection('leadership'); return false;">Leadership & Volunteer</a>
      </div>
      <div style="display:flex; gap:10px; align-items:center">
        <button class="btn-edit-toggle" onclick="toggleTheme()" title="Toggle Theme" style="background:var(--bg-card); font-size:1.2rem">🌓</button>
        <button class="btn-edit-toggle" id="editToggleBtn" onclick="toggleEditMode()" title="Edit Portfolio">✏</button>
      </div>
    </div>
  </nav>

  <section class="hero section-page active" id="home">
    <div class="container">
      <div class="hero-card-premium">
        <div class="hero-avatar-wrapper" id="heroAvatarContainer"></div>
        <div class="hero-info-box">
          <p class="hero-title" id="heroTitle"></p>
          <h1 class="hero-name" id="heroName"></h1>
          <p class="hero-uni" id="heroUni"></p>
          <div class="hero-skills" id="heroSkills"></div>
          <p class="hero-bio" id="heroBio"></p>
          <div class="hero-links" id="heroLinks"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section section-page" id="experience">
    <div class="container">
      <div class="section-header-pro">
        <span class="label">01</span>
        <h2>Professional Experience</h2>
        <div class="line"></div>
      </div>
      <div class="exp-tabs" id="expTabs"></div>
      <center><button id="addProjectBtn" class="add-btn" onclick="openAddProject()"
          style="display:none;margin-bottom:2rem">+ Add Project</button></center>
      <div class="projects-grid" id="projectsGrid"></div>
    </div>
  </section>

  <section class="section section-page" id="selfdev">
    <div class="container">
      <div class="section-header-pro">
        <span class="label">02</span>
        <h2>Self-Development</h2>
        <div class="line"></div>
      </div>
      <div class="grid-2">
        <div class="card-glass" style="padding:1.5rem">
          <div style="display:flex;justify-content:space-between">
            <h3>Certificates</h3><button id="addCertBtn" onclick="openAddItem('cert')" style="display:none">+</button>
          </div>
          <div id="certsGrid"></div>
        </div>
        <div class="card-glass" style="padding:1.5rem">
          <div style="display:flex;justify-content:space-between">
            <h3>Workshops</h3><button id="addWorkshopBtn" onclick="openAddItem('workshop')"
              style="display:none">+</button>
          </div>
          <div id="workshopsGrid"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section section-page" id="awards">
    <div class="container">
      <div class="section-header-pro">
        <span class="label">03</span>
        <h2>Awards</h2>
        <div class="line"></div>
      </div>
      <div class="card-glass" style="padding:1.5rem">
        <div style="display:flex;justify-content:space-between">
          <h3>Competitions</h3><button id="addCompBtn" onclick="openAddItem('competition_award')"
            style="display:none">+</button>
        </div>
        <div id="competitionsGrid"></div>
      </div>
    </div>
  </section>

  <section class="section section-page" id="leadership">
    <div class="container">
      <div class="section-header-pro">
        <span class="label">04</span>
        <h2>Leadership & Volunteer</h2>
        <div class="line"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:2rem">
        <h3>Activities</h3><button id="addLeaderBtn" onclick="openAddItem('leadership')" style="display:none">+</button>
      </div>
      <div id="leadershipGrid"></div>
    </div>
  </section>

  <footer class="footer" id="footerContent"></footer>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Edit Information</h3>
      <div id="modalFields"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" id="modalSaveBtn">Save Changes</button>
      </div>
    </div>
  </div>

  <div id="toast"
    style="position:fixed; bottom:2rem; right:2rem; background:var(--primary); color:white; padding:1rem 2rem; border-radius:10px; transform:translateY(200%); transition:0.3s;">
  </div>

  <div class="edit-bar" id="editBar"
    style="display:none; position:fixed; bottom:0; width:100%; background:rgba(13,13,26,0.95); padding:1rem; gap:1.5rem; justify-content:center; align-items:center; z-index:9000;">
    <span id="visitorCount" style="color:#0ea5e9; font-weight:bold; font-size:0.9rem; margin-right:1rem">📊 Visits: Loading...</span>
    <button onclick="exportData()">Export JSON</button>
    <label style="cursor:pointer; color:white; background:rgba(255,255,255,0.1); padding:0.4rem 1rem; border-radius:6px;">Import JSON<input type="file" onchange="importData(event)" style="display:none"></label>
  </div>

  <script>
    // --- SECURE EDIT TRIGGER & MINIMAL SPARKS ---
    const canvas = document.getElementById('spark-canvas');
    const ctx = canvas.getContext('2d');
    let sparks = [];
    const mouse = { x: 0, y: 0 };

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      // นานๆ ออกทีและจางมากๆ
      if (Math.random() > 0.95) {
        sparks.push({
          x: mouse.x, y: mouse.y,
          size: Math.random() * 3 + 1,
          speedX: Math.random() * 1.5 - 0.75,
          speedY: Math.random() * 1.5 - 0.75,
          opacity: 0.7 // เพิ่มความเข้มเริ่มต้นเป็น 0.7
        });
      }
    });

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < sparks.length; i++) {
        let s = sparks[i];
        s.x += s.speedX; s.y += s.speedY;
        s.opacity -= 0.01;
        ctx.fillStyle = `rgba(0, 229, 255, ${s.opacity})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
        if (s.opacity <= 0) { sparks.splice(i, 1); i--; }
      }
      requestAnimationFrame(animate);
    }
    animate();

    document.addEventListener('dblclick', (e) => {
        if (e.target.id === 'heroName' || e.target.closest('#heroName')) {
            toggleEditMode();
        }
    });

    setInterval(() => {
        const btn = document.getElementById('editToggleBtn');
        if (btn) btn.style.display = 'none';
    }, 500);
    
    document.addEventListener('mousedown', () => { if(outline) outline.classList.add('clicking'); });
    document.addEventListener('mouseup', () => { if(outline) outline.classList.remove('clicking'); });
  </script>
  <script src="app.js"></script>
</body>

</html>
