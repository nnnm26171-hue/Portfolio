<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Portfolio (V31 - Enhanced Admin Access)</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #8b5cf6;
      --cyan: #06b6d4;
      --bg-color: #020205;
      --text-color: #ffffff;
      --card-bg: rgba(10, 10, 20, 0.85);
      --card-border: rgba(139, 92, 246, 0.3);
      --accent-glow: rgba(139, 92, 246, 0.2);
    }
    body.light-mode {
      --bg-color: #f8fafc;
      --text-color: #1e293b;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(139, 92, 246, 0.1);
      --accent-glow: rgba(139, 92, 246, 0.05);
    }
    body {
      margin: 0; padding: 0; width: 100%; min-height: 100%;
      background-color: var(--bg-color);
      overflow-x: hidden;
      background-image: 
      radial-gradient(circle at 20% 30%, var(--accent-glow) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(34, 211, 238, 0.05) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-color);
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background 0.5s, color 0.5s;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 2rem; position: relative; }
    .section-page { width: 100%; display: none; padding: 100px 0; min-height: 100vh; box-sizing: border-box; }
    .section-page.active { display: block; }
    #home { height: 100vh; overflow: hidden !important; padding: 0; display: none; align-items: center; justify-content: center; }
    #home.active { display: flex; }

    .navbar { position: fixed; top: 1.5rem; left: 50%; transform: translateX(-50%); background: rgba(10, 10, 20, 0.7); backdrop-filter: blur(25px); padding: 0.5rem 1.5rem; border-radius: 100px; display: flex; align-items: center; z-index: 1000; border: 1px solid rgba(255,255,255,0.1); }
    .nav-links a { color: rgba(255,255,255,0.6); text-decoration: none; padding: 0.6rem 1.2rem; font-weight: 700; font-size: 0.8rem; border-radius: 100px; transition: 0.3s; }
    .nav-links a.active { color: #fff; background: var(--primary); box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4); }
    
    .hero-card-premium { background: var(--card-bg); backdrop-filter: blur(30px); border: 1px solid var(--card-border); border-left: 8px solid var(--primary); border-radius: 40px; padding: 4rem; display: flex; align-items: center; gap: 4rem; box-shadow: 0 40px 100px rgba(0,0,0,0.4); max-width: 1000px; position: relative; z-index: 5; }
    .hero-avatar-wrapper { width: 220px; height: 220px; min-width: 220px; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center; }
    .hero-avatar-wrapper::before { content: ''; position: absolute; inset: -15px; border: 3px solid var(--primary); border-radius: 50%; opacity: 0.8; box-shadow: 0 0 20px var(--primary); } 
    .hero-avatar { width: 220px; height: 220px; border-radius: 50%; object-fit: cover; z-index: 2; position: relative; border: 6px solid var(--card-bg); }
    .hero-name { font-size: 4rem; font-weight: 900; margin: 0; background: linear-gradient(to bottom, #ffffff 40%, var(--cyan) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: pre-wrap; line-height: 1.1; }
    body.light-mode .hero-name { background: linear-gradient(to bottom, var(--text-color) 40%, var(--primary) 100%); -webkit-background-clip: text; }

    .section-header-pro { text-align: center; margin-bottom: 5rem; }
    .section-header-pro .label { font-size: 1.2rem; font-weight: 800; color: var(--primary); letter-spacing: 4px; opacity: 0.6; text-transform: uppercase; }
    .section-header-pro h2 { 
      font-size: 3.5rem; font-weight: 900; margin: 0.5rem 0; position: relative; display: inline-block; padding-bottom: 0.5rem; 
      background: linear-gradient(135deg, #ffffff, var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
    }
    body.light-mode .section-header-pro h2 { 
      background: linear-gradient(135deg, var(--primary), #f43f5e); 
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .section-header-pro .line { width: 100px; height: 4px; background: linear-gradient(90deg, var(--primary), var(--cyan)); margin: 0 auto; border-radius: 10px; }
    body.light-mode .section-header-pro .line { background: linear-gradient(90deg, var(--primary), #f43f5e); }

    .project-card { 
      background: var(--card-bg); 
      border: 1px solid var(--card-border); 
      border-left: 4px solid var(--primary); 
      border-radius: 32px; 
      padding: 3rem; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      text-align: center; 
      margin-bottom: 3rem; 
      width: 100%; 
      box-sizing: border-box; 
      position: relative; 
      backdrop-filter: blur(20px);
    }
    .project-card h3 { 
      font-size: 2rem; 
      font-weight: 800; 
      color: var(--text-color); 
      margin-bottom: 0.5rem; 
      letter-spacing: -0.5px;
    }
    body.light-mode .project-card h3 { color: #000; }
    .project-img-circle { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--primary); margin-bottom: 1.5rem; object-fit: cover; cursor: pointer; }
    
    .item-row-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 1.5rem; margin-bottom: 1.5rem; text-align: center; width: 100%; position: relative; }
    .skill-tag { background: rgba(139, 92, 246, 0.1); padding: 0.6rem 1.2rem; border-radius: 100px; font-size: 0.85rem; font-weight: 700; border: 1px solid var(--card-border); transition: 0.3s; cursor: pointer; color: var(--text-color); }
    .email-cta { 
      background: var(--primary); 
      color: #fff; 
      text-decoration: none; 
      padding: 0.8rem 2.5rem; 
      border-radius: 100px; 
      font-weight: 800; 
      display: inline-flex; 
      align-items: center; 
      gap: 0.8rem; 
      margin-top: 1.5rem; 
      transition: 0.3s; 
      cursor: pointer; 
      border: none; 
      box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
    }
    .email-cta:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(139, 92, 246, 0.4); }
    
    .sky { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    .edge-glow { position: fixed; top: 0; width: 2px; height: 100vh; z-index: 9999; opacity: 0.8; pointer-events: none; transition: 0.5s; }
    .edge-left { left: 0; background: var(--primary); box-shadow: 0 0 30px 10px var(--primary); }
    .edge-right { right: 0; background: var(--cyan); box-shadow: 0 0 30px 10px var(--cyan); }
    
    body.light-mode .edge-glow { display: none; }

    .glass-orb { position: absolute; border-radius: 50%; filter: blur(60px); pointer-events: none; opacity: 0.4; animation: orb-float 20s infinite alternate; }
    @keyframes orb-float { from { transform: translate(0,0); } to { transform: translate(100px, 100px); } }

    .star-ultra { position: absolute; background: linear-gradient(90deg, #fff, transparent); height: 2px; border-radius: 100px; opacity: 0; animation: star-move var(--dur) linear infinite; box-shadow: 0 0 10px #fff, 0 0 20px var(--primary); }
    @keyframes star-move { 0% { transform: translateX(0) scaleX(0); opacity: 0; } 10% { opacity: 1; transform: translateX(-100px) scaleX(1); } 30% { transform: translateX(-800px) scaleX(1.5); opacity: 0; } 100% { opacity: 0; } }
    .twinkle { position: absolute; background: #fff; border-radius: 50%; opacity: 0; animation: twinkle-anim var(--d) linear infinite; }
    @keyframes twinkle-anim { 0%, 100% { opacity: 0; } 50% { opacity: 0.8; } }

    /* MODAL */
    #adminModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; z-index: 10000; }
    .modal-content { background: rgba(15, 15, 25, 0.8); border: 1px solid rgba(255,255,255,0.1); padding: 3rem; border-radius: 30px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
    .modal-input { width: 100%; padding: 1rem; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #fff; font-size: 1.1rem; text-align: center; margin-bottom: 1.5rem; transition: 0.3s; }
    .modal-input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 15px var(--primary); }
    .modal-btn { background: var(--primary); color: #fff; border: none; padding: 0.8rem 2rem; border-radius: 100px; font-weight: 800; cursor: pointer; transition: 0.3s; }
    .modal-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); }

    .edit-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.9); padding: 1.5rem; display: none; justify-content: center; gap: 1rem; z-index: 9999; border-top: 3px solid var(--primary); backdrop-filter: blur(10px); }
    .add-btn { background: var(--cyan); color: #000; border: none; padding: 0.5rem 1rem; border-radius: 100px; font-weight: 800; cursor: pointer; margin: 1rem auto; display: block; }
    .del-btn { position: absolute; top: 1rem; right: 1rem; background: #ff4444; color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: 900; z-index: 10; display: none; }
    body.edit-mode-active .del-btn { display: block; }
    [contenteditable="true"] { 
      outline: 2px solid var(--primary); 
      padding: 6px; 
      border-radius: 12px; 
      background: rgba(139, 92, 246, 0.15); 
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
      transition: 0.2s;
    }
    [contenteditable="true"]:focus { 
      background: rgba(255, 255, 255, 0.1); 
      outline: 3px solid var(--cyan); 
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.3);
      color: #fff !important;
    }
    body.light-mode [contenteditable="true"]:focus {
      background: rgba(255, 255, 255, 1);
      color: #000 !important;
    }
  </style>
</head>
<body class="">
  <div class="edge-glow edge-left"></div>
  <div class="edge-glow edge-right"></div>
  <div id="adminModal">
    <div class="modal-content">
      <h3 style="margin-bottom:1.5rem;">🔒 Admin Access</h3>
      <input type="password" id="adminPass" class="modal-input" placeholder="Password">
      <div style="display:flex; gap:1rem; justify-content:center;">
        <button class="modal-btn" onclick="checkAdminPass()">Login</button>
        <button class="modal-btn" style="background:rgba(255,255,255,0.1);" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <div class="sky" id="sky"></div>
  
  <nav class="navbar">
    <div class="nav-links">
      <a href="#home" class="active" onclick="showSection('home'); return false;">Home</a>
      <a href="#experience" onclick="showSection('experience'); return false;">Experience</a>
      <a href="#selfdev" onclick="showSection('selfdev'); return false;">Skills</a>
      <a href="#awards" onclick="showSection('awards'); return false;">Awards</a>
      <a href="#leadership" onclick="showSection('leadership'); return false;">Leadership</a>
    </div>
    <button onclick="toggleTheme()" style="background:none; border:none; color:#fff; cursor:pointer; margin-left:1rem; font-size:1.2rem;">🌓</button>
  </nav>

  <section id="home" class="section-page active">
    <div class="container">
      <div class="hero-card-premium">
        <div class="hero-avatar-wrapper">
          <div id="heroAvatarContainer"></div>
        </div>
        <div>
          <p id="heroTitle" style="color:var(--primary); font-weight:800; letter-spacing:2px; margin-bottom:0.5rem;"></p>
          <h1 id="heroName" class="hero-name"></h1>
          <p id="heroUni" style="opacity:0.6; margin-bottom:1rem; font-weight:600;"></p>
          <div id="heroSkills" style="display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1.5rem;"></div>
          <p id="heroBio" style="opacity:0.8; line-height:1.8; max-width:600px; margin-bottom:1.5rem;"></p>
          <div id="heroEmailContainer"></div>
          <div id="heroLinks" style="display:flex; gap:1.2rem; margin-top:2rem;"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="experience" class="section-page">
    <div class="container">
      <div class="section-header-pro"><span class="label">01</span><br><h2>Experience<div class="line"></div></h2></div>
      <div id="expTabs" style="display:flex; justify-content:center; gap:1rem; margin-bottom:2rem;"></div>
      <div id="projectsGrid"></div>
    </div>
  </section>

  <section id="selfdev" class="section-page">
    <div class="container">
      <div class="section-header-pro"><span class="label">02</span><br><h2>Skills & Development<div class="line"></div></h2></div>
      <div id="certsGrid"></div>
      <div id="workshopsGrid" style="margin-top:2rem;"></div>
    </div>
  </section>

  <section id="awards" class="section-page">
    <div class="container">
      <div class="section-header-pro"><span class="label">03</span><br><h2>Awards<div class="line"></div></h2></div>
      <div id="competitionsGrid"></div>
    </div>
  </section>

  <section id="leadership" class="section-page">
    <div class="container">
      <div class="section-header-pro"><span class="label">04</span><br><h2>Leadership<div class="line"></div></h2></div>
      <div id="leadershipGrid"></div>
    </div>
  </section>

  <div class="edit-bar" id="editBar">
    <button class="modal-btn" style="background:#22c55e;" onclick="saveData()">💾 Save All Changes</button>
    <button class="modal-btn" style="background:#ff4444;" onclick="exitEditMode()">🔒 Close</button>
  </div>

  <script>
    const sky = document.getElementById('sky');
    function initBackground() {
      if (!sky) return;
      const isLight = document.body.classList.contains('light-mode');
      sky.innerHTML = '';
      if (isLight) {
        for(let i=0; i<10; i++) {
          const o = document.createElement('div'); o.className = 'glass-orb';
          o.style.left = Math.random()*100+'%'; o.style.top = Math.random()*100+'%';
          o.style.width = o.style.height = (Math.random()*300+200)+'px';
          o.style.background = i % 2 === 0 ? 'var(--primary)' : '#f43f5e';
          o.style.animationDelay = (Math.random()*5)+'s';
          sky.appendChild(o);
        }
      } else {
        for(let i=0; i<80; i++) {
          const s = document.createElement('div'); s.className = 'twinkle';
          s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
          s.style.width = s.style.height = (Math.random()*2+1)+'px';
          s.style.setProperty('--d', (Math.random()*4+2)+'s');
          sky.appendChild(s);
        }
      }
    }
    initBackground();

    function createShootingStar() {
      if (document.body.classList.contains('light-mode')) return;
      const s = document.createElement('div');
      s.className = 'star-ultra';
      s.style.top = Math.random()*70 + '%'; s.style.left = '100%';
      s.style.width = (Math.random()*150+100) + 'px';
      s.style.setProperty('--dur', (Math.random()*2+2) + 's');
      sky.appendChild(s); setTimeout(() => s.remove(), 4000);
    }
    setInterval(createShootingStar, 2000);

    const SUPABASE_URL = 'https://odyrnnzcixwnpcirtaad.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_BFWtCpz_nUWiixMnbjGObQ_ApM9I20l';
    const db = (typeof supabase !== 'undefined') ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
    let data = { personal:{}, experience:{ production:[], competition:[], academic:[], personal:[], opensource:[] }, selfDev:{ certs:[], workshops:[] }, awards:[], leadership:[] };
    let currentTab = 'production', editMode = false;

    async function loadData() {
      try { if(db) { const {data:dbData} = await db.from('Portfolio_data').select('content').eq('id','main_portfolio').single(); if(dbData) data = dbData.content; } } catch(e) {}
      renderAll();
    }
    async function saveData() {
      try {
        if(!db) return;
        const { error } = await db.from('Portfolio_data').update({ content: data }).eq('id', 'main_portfolio');
        if(error) throw error;
        alert("✅ Data Saved Successfully!");
        exitEditMode();
      } catch(e) { alert("❌ Save Failed: " + e.message); }
    }
    function exitEditMode() { editMode = false; document.body.classList.remove('edit-mode-active'); document.getElementById('editBar').style.display='none'; renderAll(); }
    
    function showSection(id) { 
      document.querySelectorAll('.section-page').forEach(s => s.classList.toggle('active', s.id === id)); 
      document.querySelectorAll('.nav-links a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#'+id)); 
      document.body.style.overflowY = (id === 'home') ? 'hidden' : 'auto';
      window.scrollTo(0,0);
    }

    function openModal() { 
      document.getElementById('adminModal').style.display = 'flex'; 
      document.getElementById('adminPass').focus();
    }
    function closeModal() { document.getElementById('adminModal').style.display = 'none'; }
    function checkAdminPass() {
      if(document.getElementById('adminPass').value === "1234") { 
        editMode = true; 
        document.body.classList.add('edit-mode-active');
        document.getElementById('editBar').style.display = 'flex'; 
        closeModal(); 
        renderAll();
      } else { alert("Incorrect Password!"); }
    }
    document.getElementById('adminPass').onkeypress = (e) => { if(e.key==='Enter') checkAdminPass(); };
    
    // Robust Admin Triggers
    let clickCount = 0, clickTimer;
    document.addEventListener('click', (e) => {
      if (e.target.closest('.hero-avatar-wrapper') || e.target.closest('.hero-name')) {
        clickCount++;
        clearTimeout(clickTimer);
        if (clickCount >= 3) { clickCount = 0; openModal(); } 
        else { clickTimer = setTimeout(() => { clickCount = 0; }, 1500); }
      }
    });

    let zeroCount = 0, zeroTimer;
    document.addEventListener('keydown', (e) => { 
      if(e.key === '0'){ 
        clearTimeout(zeroTimer);
        zeroCount++; 
        if(zeroCount === 3){ openModal(); zeroCount = 0; } 
        else { zeroTimer = setTimeout(() => zeroCount = 0, 1500); }
      } 
      if(e.shiftKey && e.key.toLowerCase() === 'a') { openModal(); }
    });

    function updateText(path, val) {
      const parts = path.split('.');
      let target = data;
      for(let i=0; i<parts.length-1; i++) {
        if(!target[parts[i]]) target[parts[i]] = {};
        target = target[parts[i]];
      }
      target[parts[parts.length-1]] = val;
    }
    function changeImg(path) {
      const url = prompt("Enter new image URL:");
      if(url) { updateText(path, url); renderAll(); }
    }

    function renderAll() {
      const p = data.personal || {};
      const edit = editMode ? 'contenteditable="true"' : '';
      const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
      
      const setH = (id, path) => {
        const el = document.getElementById(id);
        if(!el) return;
        const val = path.split('.').reduce((o,i)=> (o?o[i]:''), data);
        el.textContent = val || '';
        if(editMode) el.setAttribute('contenteditable','true');
        else el.removeAttribute('contenteditable');
        el.onblur = () => updateText(path, el.innerText);
      };

      setH('heroName', 'personal.name');
      setH('heroTitle', 'personal.title');
      setH('heroUni', 'personal.university');
      setH('heroBio', 'personal.bio');
      const emailEl = document.getElementById('heroEmailContainer');
      if (emailEl) {
        if (editMode) {
          emailEl.innerHTML = `
            <div style="margin-top:1.5rem; background:rgba(139, 92, 246, 0.1); padding:1rem; border-radius:15px; border:1px dashed var(--primary); text-align:left;">
              <label style="font-size:0.8rem; display:block; margin-bottom:0.5rem; opacity:0.7; color:#fff;">Edit Email Address:</label>
              <input type="text" id="emailInput" value="${p.email || ''}" 
                style="background:rgba(0,0,0,0.3); border:1px solid var(--primary); color:#fff; padding:0.6rem; border-radius:8px; width:100%; box-sizing:border-box; margin-bottom:0.5rem;" 
                onchange="data.personal.email=this.value"
              >
              <a href="mailto:${p.email || ''}" class="email-cta" style="margin-top:0.5rem; font-size:0.9rem; padding:0.6rem 1.5rem;">Contact Me (Preview)</a>
            </div>`;
        } else {
          emailEl.innerHTML = `<a href="mailto:${p.email || ''}" class="email-cta">Contact Me</a>`;
        }
      }
      
      const avatarCont = document.getElementById('heroAvatarContainer');
      if (avatarCont) {
        if (editMode) {
          avatarCont.innerHTML = `
            <div style="position:relative; display:flex; flex-direction:column; align-items:center; gap:1rem;">
              ${p.avatar ? `<img class="hero-avatar" src="${p.avatar}">` : `<div class="hero-avatar" style="background:var(--primary); display:flex; align-items:center; justify-content:center; font-size:4rem; font-weight:900; border-radius:50%;">${(p.name||'U')[0]}</div>`}
              <div style="background:rgba(139, 92, 246, 0.1); padding:0.8rem; border-radius:12px; border:1px dashed var(--primary); width:220px; text-align:left;">
                <label style="font-size:0.7rem; display:block; margin-bottom:0.3rem; opacity:0.7; color:#fff;">Avatar URL:</label>
                <input type="text" value="${p.avatar || ''}" 
                  style="background:rgba(0,0,0,0.3); border:1px solid var(--primary); color:#fff; padding:0.4rem; border-radius:6px; width:100%; font-size:0.8rem; box-sizing:border-box;" 
                  onchange="data.personal.avatar=this.value; renderAll();"
                >
              </div>
            </div>`;
        } else {
          avatarCont.innerHTML = p.avatar ? `<img class="hero-avatar" src="${p.avatar}">` : `<div class="hero-avatar" style="background:var(--primary); display:flex; align-items:center; justify-content:center; font-size:4rem; font-weight:900; border-radius:50%;">${(p.name||'U')[0]}</div>`;
        }
      }
      
      document.getElementById('heroSkills').innerHTML = (p.skills||[]).map((s,i) => `<span class="skill-tag" ${edit} ondblclick="if(this.innerText.includes('CSS')) openModal()" onblur="data.personal.skills[${i}]=this.innerText">${esc(s)}</span>`).join('') + (editMode?`<button class="skill-tag" onclick="data.personal.skills.push('New Skill');renderAll()">+</button>`:'');
      
      const tabList = [['production','🏢 Production'],['competition','🏅 Competition'],['academic','🎓 Academic'],['personal','💡 Personal'],['opensource','🔓 Open Source']];
      document.getElementById('expTabs').innerHTML = tabList.map(([k,l])=>`
        <button onclick="currentTab='${k}';renderAll()" style="
          padding:0.7rem 1.5rem; 
          border-radius:100px; 
          border:none; 
          background:${currentTab===k?'var(--primary)':(document.body.classList.contains('light-mode')?'rgba(0,0,0,0.05)':'rgba(255,255,255,0.08)')}; 
          color:${currentTab===k?'#fff':'var(--text-color)'}; 
          opacity:${currentTab===k?'1':'0.8'};
          cursor:pointer; 
          font-weight:700; 
          transition:0.3s; 
          ${currentTab===k?'box-shadow:0 10px 20px rgba(139, 92, 246, 0.3);':''}
        ">${l}</button>`).join('');
      
      const projects = (data.experience && data.experience[currentTab]) || [];
      document.getElementById('projectsGrid').innerHTML = projects.map((proj,i) => `
        <div class="project-card">
          ${editMode?`<button class="del-btn" onclick="data.experience['${currentTab}'].splice(${i},1);renderAll()">×</button>`:''}
          <img class="project-img-circle" src="${proj.img}" ${editMode?`onclick="changeImg('experience.${currentTab}.${i}.img')"`:''}>
          <div class="project-content">
            <h3 ${edit} onblur="data.experience['${currentTab}'][${i}].name=this.innerText">${esc(proj.name)}</h3>
            <div ${edit} onblur="data.experience['${currentTab}'][${i}].year=this.innerText" style="opacity:0.6; margin:0.5rem 0;">${esc(proj.year)}</div>
            <div ${edit} onblur="data.experience['${currentTab}'][${i}].role=this.innerText" style="color:var(--cyan); font-weight:800; font-size:1rem; margin-bottom:1.2rem;">${esc(proj.role)}</div>
            <p ${edit} onblur="data.experience['${currentTab}'][${i}].description=this.innerText">${esc(proj.description)}</p>
          </div>
        </div>`).join('') + (editMode?`<button class="add-btn" onclick="data.experience['${currentTab}'].push({name:'New Project',year:'2024',role:'Role',description:'Desc',img:''});renderAll()">+ Add Project</button>`:'');

      const renderRow = (list, path) => (list||[]).map((item,i) => `
        <div class="item-row-card">
          ${editMode?`<button class="del-btn" onclick="data.${path}.splice(${i},1);renderAll()">×</button>`:''}
          <strong ${edit} onblur="data.${path}[${i}].name=this.innerText">${esc(item.name)}</strong> • 
          <span ${edit} onblur="data.${path}[${i}].year=this.innerText">${esc(item.year)}</span>
        </div>`).join('') + (editMode?`<button class="add-btn" onclick="data.${path}.push({name:'New Item',year:'2024'});renderAll()">+ Add Item</button>`:'');

      if(data.selfDev) {
        document.getElementById('certsGrid').innerHTML = renderRow(data.selfDev.certs, 'selfDev.certs');
        document.getElementById('workshopsGrid').innerHTML = renderRow(data.selfDev.workshops, 'selfDev.workshops');
      }
      document.getElementById('competitionsGrid').innerHTML = renderRow(data.awards, 'awards');
      document.getElementById('leadershipGrid').innerHTML = renderRow(data.leadership, 'leadership');
    }

    function toggleTheme() { document.body.classList.toggle('light-mode'); initBackground(); }
    window.onload = loadData;
  </script>
</body>
</html>
