<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css?v=999">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* บังคับหัวข้อให้แสดงผล 100% ป้องกันปัญหาบน GitHub Pages */
    .section-header-pro {
      background: red !important; /* ทดสอบว่ากล่องขึ้นไหม */
      padding: 20px !important;
      opacity: 1 !important;
      visibility: visible !important;
      display: flex !important;
    }
    .section-header-pro h2, .section-header-pro .line, .section-header-pro span {
      opacity: 1 !important;
      visibility: visible !important;
      color: white !important;
      display: block !important;
    }
  </style>
</head>

<body>
  <canvas id="spark-canvas"></canvas>
  <div class="bg-container">
    <div class="grain-overlay"></div>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="shooting-star star-1" style="top:10%; left:20%; animation-delay: 0s;"></div>
    <div class="shooting-star star-2" style="top:30%; left:50%; animation-delay: 2s;"></div>
    <div class="shooting-star star-3" style="top:60%; left:80%; animation-delay: 4s;"></div>
  </div>
  <div id="cursor-dot"></div>
  <div id="cursor-outline"></div>
  <div id="cursor-glow"></div>

  <nav class="navbar">
    <div class="nav-right-group">
      <div class="nav-links">
        <a href="#home" class="active" onclick="showSection('home'); return false;">Home</a>
        <a href="#experience" onclick="showSection('experience'); return false;">Experience</a>
        <a href="#selfdev" onclick="showSection('selfdev'); return false;">Skills</a>
        <a href="#awards" onclick="showSection('awards'); return false;">Awards</a>
        <a href="#leadership" onclick="showSection('leadership'); return false;">Leadership & Volunteer</a>
      </div>
      <div style="display:flex; gap:10px; align-items:center">
        <button class="btn-edit-toggle" onclick="toggleTheme()" title="Toggle Theme" style="background:var(--bg-card); font-size:1.2rem">🌓</button>
        <button class="btn-edit-toggle" id="editToggleBtn" onclick="toggleEditMode()" title="Edit Portfolio">✏</button>
      </div>
    </div>
  </nav>

  <section class="hero section-page active" id="home">
    <div class="container">
      <div class="hero-card-premium">
        <div class="hero-avatar-wrapper" id="heroAvatarContainer"></div>
        <div class="hero-info-box">
          <p class="hero-title" id="heroTitle"></p>
          <h1 class="hero-name" id="heroName"></h1>
          <p class="hero-uni" id="heroUni"></p>
          <div class="hero-skills" id="heroSkills"></div>
          <p class="hero-bio" id="heroBio"></p>
          <div class="hero-links" id="heroLinks"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section section-page" id="experience">
    <div class="container">
      <div class="section-header-pro">
        <span class="label">01 - FORCE</span>
        <h2>Professional Experience</h2>
        <div class="line"></div>
      </div>
      <div class="exp-tabs" id="expTabs"></div>
      <center><button id="addProjectBtn" class="add-btn" onclick="openAddProject()"
          style="display:none;margin-bottom:2rem">+ Add Project</button></center>
      <div class="projects-grid" id="projectsGrid"></div>
    </div>
  </section>

  <section class="section section-page" id="selfdev">
    <div class="container">
      <div class="section-header-pro">
        <span class="label">02 - FORCE</span>
        <h2>Self-Development</h2>
        <div class="line"></div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:1rem">
        <button id="addCertBtn" onclick="openAddItem('cert')" style="display:none">+</button>
        <button id="addWorkshopBtn" onclick="openAddItem('workshop')" style="display:none">+</button>
      </div>
      <div class="grid-2">
        <div id="certsGrid"></div>
        <div id="workshopsGrid"></div>
      </div>
    </div>
  </section>

  <section class="section section-page" id="awards">
    <div class="container">
      <div class="section-header-pro">
        <span class="label">03 - FORCE</span>
        <h2>Awards</h2>
        <div class="line"></div>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:1rem">
        <button id="addCompBtn" onclick="openAddItem('competition_award')" style="display:none">+</button>
      </div>
      <div id="competitionsGrid"></div>
    </div>
  </section>

  <section class="section section-page" id="leadership">
    <div class="container">
      <div class="section-header-pro">
        <span class="label">04 - FORCE</span>
        <h2>Leadership & Volunteer</h2>
        <div class="line"></div>
      </div>
      <div style="display:flex;justify-content:space-between;">
        <button id="addLeaderBtn" onclick="openAddItem('leadership')" style="display:none">+</button>
      </div>
      <div id="leadershipGrid"></div>
    </div>
  </section>

  <footer class="footer" id="footerContent"></footer>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Edit Information</h3>
      <div id="modalFields"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" id="modalSaveBtn">Save Changes</button>
      </div>
    </div>
  </div>

  <div id="toast"
    style="position:fixed; bottom:2rem; right:2rem; background:var(--primary); color:white; padding:1rem 2rem; border-radius:10px; transform:translateY(200%); transition:0.3s;">
  </div>

  <style>
    .edit-bar {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      background: rgba(10, 10, 20, 0.9) !important; 
      padding: 0.8rem 2.5rem !important; /* เพิ่ม padding ข้าง */
      border-radius: 100px;
      display: flex; gap: 2rem !important; /* เว้นระยะห่างให้เท่ากัน */
      border: 1px solid var(--primary); 
      z-index: 99999 !important;
      align-items: center !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .edit-bar button, .edit-bar span, .edit-bar label { 
      background: transparent; 
      border: none; 
      color: #fff !important; 
      font-weight: 600 !important; 
      cursor: pointer; 
      font-size: 0.85rem !important; /* ขนาดเท่ากันหมด */
      margin: 0 !important;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }
    body.light-mode .edit-bar { background: rgba(255, 255, 255, 0.95) !important; border-color: var(--primary) !important; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    body.light-mode .edit-bar button, body.light-mode .edit-bar span, body.light-mode .edit-bar label { color: #0f172a !important; }
  </style>
  <div class="edit-bar" id="editBar" style="display:none;">
    <span id="visitorCount">📊 Visits: Loading...</span>
    <button onclick="exportData()">Export JSON</button>
    <label>Import JSON<input type="file" onchange="importData(event)" style="display:none"></label>
  </div>

  <script>
    // --- SECURE EDIT TRIGGER & MINIMAL SPARKS ---
    const canvas = document.getElementById('spark-canvas');
    const ctx = canvas.getContext('2d');
    let sparks = [];
    const mouse = { x: 0, y: 0 };

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      // สะเก็ดไฟสีฟ้า Neon (Blue Fire Sparks)
      if (Math.random() > 0.85) {
        sparks.push({
          x: mouse.x, y: mouse.y,
          size: Math.random() * 4 + 1,
          speedX: Math.random() * 3 - 1.5,
          speedY: Math.random() * 3 - 1.5,
          opacity: 1,
          color: Math.random() > 0.5 ? '#00e5ff' : '#00b8ff' // ฟ้า Cyan และ ฟ้าเข้ม
        });
      }
    });

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < sparks.length; i++) {
        let s = sparks[i];
        s.x += s.speedX; s.y += s.speedY;
        s.opacity -= 0.02;
        
        ctx.fillStyle = s.color;
        ctx.globalAlpha = s.opacity;
        ctx.beginPath(); 
        // วาดเป็นสี่เหลี่ยมเล็กๆ (Square Sparks) แทนวงกลม
        ctx.fillRect(s.x, s.y, s.size, s.size); 
        
        ctx.globalAlpha = 1;
        if (s.opacity <= 0) { sparks.splice(i, 1); i--; }
      }
      requestAnimationFrame(animate);
    }
    animate();

    document.addEventListener('dblclick', (e) => {
        if (e.target.id === 'heroName' || e.target.closest('#heroName')) {
            toggleEditMode();
        }
    });


    
    document.addEventListener('mousedown', () => { if(outline) outline.classList.add('clicking'); });
    document.addEventListener('mouseup', () => { if(outline) outline.classList.remove('clicking'); });
  </script>
  <script src="app.js"></script>
</body>

</html>
