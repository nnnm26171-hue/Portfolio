<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio (V5 - Ironclad Center)</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ========== INTERNAL STYLES (FROM STYLE.CSS) ========== */
    :root {
      --bg-color: #020205;
      --bg-image: radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(34, 211, 238, 0.1) 0%, transparent 50%),
        radial-gradient(1.5px 1.5px at 100px 100px, #fff, rgba(0, 0, 0, 0)),
        radial-gradient(2px 2px at 200px 300px, #fff, rgba(0, 0, 0, 0));
      --text-color: #ffffff;
      --card-bg: rgba(20, 20, 35, 0.5);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary: #8b5cf6;
      --cyan: #0ea5e9;
      --primary-glow: rgba(139, 92, 246, 0.4);
    }

    body.light-mode {
      --bg-color: #1a1a2e;
      --text-color: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.7);
      --card-bg: rgba(20, 20, 40, 0.6);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary: #d946ef;
      --cyan: #06b6d4;
      background-color: #1a1a2e !important;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.3) 0%, transparent 60%),
        radial-gradient(circle at 80% 20%, rgba(217, 70, 239, 0.3) 0%, transparent 60%),
        radial-gradient(circle at 50% 80%, rgba(6, 182, 212, 0.2) 0%, transparent 60%),
        /* เลเยอร์ดาวสำหรับโหมดสว่าง */
        radial-gradient(1px 1px at 20px 30px, #fff, transparent),
        radial-gradient(1.2px 1.2px at 150px 50px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 80px 180px, #fff, transparent),
        radial-gradient(1px 1px at 280px 220px, #fff, transparent) !important;
      background-size: 100% 100%, 100% 100%, 100% 100%, 250px 250px, 350px 350px, 400px 400px, 450px 450px !important;
      background-repeat: repeat !important;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #020205 !important;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(34, 211, 238, 0.05) 0%, transparent 50%),
        /* เลเยอร์ดาว 3 ชั้นที่ขนาดไม่เท่ากันเพื่อไม่ให้เกิดรอยขีด */
        radial-gradient(1px 1px at 20px 30px, #fff, transparent),
        radial-gradient(1.2px 1.2px at 150px 50px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 80px 180px, #fff, transparent),
        radial-gradient(1px 1px at 280px 220px, #fff, transparent) !important;
      background-size: 100% 100%, 100% 100%, 250px 250px, 350px 350px, 400px 400px, 450px 450px !important;
      background-repeat: repeat !important;
      background-attachment: fixed !important;
      color: var(--text-color);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }
    
    .bg-orb {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.2;
      z-index: -1;
      pointer-events: none;
    }
    .orb-1 { top: 10%; left: 10%; background: var(--primary); animation: float 20s infinite alternate; }
    .orb-2 { bottom: 10%; right: 10%; background: var(--cyan); animation: float 25s infinite alternate-reverse; }
    
    @keyframes float {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(100px, 50px) scale(1.1); }
    }

    /* Removed grain-overlay for a cleaner look with stars */

    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .shooting-star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 15px 3px #fff, 0 0 25px 6px var(--primary);
      opacity: 0;
      z-index: 1;
      animation: shoot 4s linear infinite;
    }

    .shooting-star::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 60px; /* ลดความยาวหางดาวตก */
      height: 1px;
      background: linear-gradient(to right, rgba(255,255,255,0.8), transparent);
    }

    @keyframes shoot {
      0% {
        transform: translate(0, 0) rotate(-45deg);
        opacity: 0;
      }

      5% {
        opacity: 1;
      }

      15% {
        transform: translate(-600px, 600px) rotate(-45deg);
        opacity: 0;
      }

      100% {
        transform: translate(-600px, 600px) rotate(-45deg);
        opacity: 0;
      }
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem;
      position: relative;
      z-index: 10;
    }

    .section-header-pro {
      text-align: center;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      background: transparent !important;
      opacity: 1 !important;
      visibility: visible !important;
    }

    .section-header-pro .label {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary) !important;
      letter-spacing: 2px;
      opacity: 1 !important;
      display: block !important;
    }

    .section-header-pro h2 {
      font-size: 2.8rem;
      font-weight: 900;
      margin: 0;
      padding: 0;
      line-height: 1.2;
      background: linear-gradient(to right, #ffffff, var(--cyan)) !important;
      -webkit-background-clip: text !important;
      background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      color: transparent !important;
      opacity: 1 !important;
      visibility: visible !important;
    }

    .section-header-pro .line {
      width: 80px;
      height: 4px;
      background: linear-gradient(to right, var(--primary), var(--cyan));
      border-radius: 10px;
      margin-top: 1rem;
      opacity: 1 !important;
    }

    .navbar {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      width: fit-content;
      min-width: 320px;
      height: 60px;
      padding: 0.5rem;
      background: rgba(10, 10, 20, 0.7);
      backdrop-filter: blur(25px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.6rem 1.2rem;
      border-radius: 100px;
      transition: 0.3s;
    }

    .nav-links a.active {
      color: #fff;
      background: var(--primary);
    }

    /* ========== PREMIUM HERO CARD RESTORED ========== */
    .hero { padding-bottom: 80px; }
    .hero-card-premium {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      padding: 4rem;
      display: flex;
      align-items: center;
      gap: 4rem;
      text-align: left;
      margin-bottom: 3rem;
      box-shadow: 0 40px 100px rgba(0,0,0,0.4);
    }
    
    .hero-avatar-wrapper { 
      width: 220px; height: 220px; min-width: 220px;
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    
    .hero-avatar-wrapper::before, .hero-avatar-wrapper::after {
      content: ''; position: absolute; inset: -5px;
      border: 1px solid var(--primary);
      border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
      animation: avatar-morph 8s ease-in-out infinite alternate, rotate-ring 15s linear infinite;
      opacity: 0.3;
      z-index: 1;
    }
    
    @keyframes avatar-morph {
      0% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
      100% { border-radius: 50% 50% 50% 50% / 50% 50% 50% 50%; }
    }
    
    @keyframes rotate-ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .hero-avatar {
      width: 100%; height: 100%; border-radius: 50%;
      object-fit: cover; border: 2px solid rgba(255,255,255,0.2);
      position: relative; z-index: 2; transition: 0.5s;
    }
    .hero-card-premium:hover .hero-avatar { transform: scale(1.05); }

    .hero-name { 
      font-size: 4rem; line-height: 1.1; margin-bottom: 1rem; font-weight: 900;
      background: linear-gradient(to right, #fff, var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero-title { font-family: 'JetBrains Mono'; color: var(--primary); font-weight: 700; font-size: 1.1rem; margin-bottom: 0.5rem; }
    
    .hero-links { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-top: 2rem; }
    .email-cta {
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      color: #fff; padding: 0.8rem 2rem; border-radius: 100px;
      font-weight: 800; text-decoration: none; box-shadow: 0 10px 25px var(--primary-glow);
    }
    .social-icon {
      width: 45px; height: 45px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; text-decoration: none; transition: 0.3s;
    }
    .social-icon:hover { background: var(--primary); transform: translateY(-3px); }

    .skill-tag {
      padding: 0.5rem 1.2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      transition: 0.3s;
    }

    .skill-tag:hover {
      background: var(--primary);
      transform: translateY(-3px);
    }

    .section-page {
      display: none;
      opacity: 0;
      padding-top: 120px;
      min-height: 100vh;
      transition: 0.5s;
    }

    .section-page.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .projects-grid,
    #certsGrid,
    #workshopsGrid,
    #competitionsGrid,
    #leadershipGrid {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .project-card, .activity-card, .item-row-card { 
      background: rgba(255,255,255,0.03); 
      border: 1px solid rgba(255,255,255,0.1); 
      border-radius: 32px; 
      padding: 2.5rem; 
      display: flex !important; 
      flex-direction: column !important; 
      align-items: center !important; 
      text-align: center !important; 
      transition: 0.3s; 
      width: 100%;
    }
    .project-content { 
      width: 100% !important; 
      display: flex !important; 
      flex-direction: column !important; 
      align-items: center !important; 
      text-align: center !important; 
    }
    .project-desc { 
      text-align: center !important; 
      margin: 0 auto !important; 
      max-width: 100% !important;
    }

    .project-img-circle,
    .activity-img,
    .item-img-mini {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--primary);
      margin-bottom: 1rem;
    }

    #spark-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100000;
    }

    #cursor-dot {
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 100001;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px var(--primary);
    }

    /* Edit Mode UI */
    .edit-bar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 20, 0.9);
      padding: 0.8rem 2rem;
      border-radius: 100px;
      display: none;
      gap: 1.5rem;
      border: 1px solid var(--primary);
      z-index: 99999;
      align-items: center;
    }

    .edit-bar button,
    .edit-bar span {
      color: #fff;
      background: transparent;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200000;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: #0d0d1a;
      border: 2px solid var(--primary);
      border-radius: 32px;
      width: 90%;
      max-width: 600px;
      padding: 2rem;
      color: #fff;
    }

    .f-group {
      margin-bottom: 1rem;
    }

    .f-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .f-group input,
    .f-group textarea {
      width: 100%;
      padding: 0.8rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }
  </style>
</head>

<body>
  <canvas id="spark-canvas"></canvas>

  <div id="toast"
    style="position:fixed; bottom:2rem; right:2rem; background:var(--primary); color:white; padding:1rem 2rem; border-radius:10px; transform:translateY(200%); transition:0.3s; z-index:999999;">
  </div>

  <script>
    /* ========== MOUSE & SPARK LOGIC (REFINED) ========== */
    const sparkCanvas = document.getElementById('spark-canvas');
    const ctx = sparkCanvas.getContext('2d');
    let sparks = [];
    function resize() { sparkCanvas.width = window.innerWidth; sparkCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    function createSpark(x, y, color) {
      sparks.push({
        x, y, size: Math.random() * 1.5 + 0.5,
        speedX: (Math.random() - 0.5) * 1, speedY: (Math.random() - 0.5) * 1,
        opacity: 0.8, color: color || '#0ea5e9'
      });
    }

    document.addEventListener('mousemove', (e) => {
      createSpark(e.clientX, e.clientY, document.body.classList.contains('light-mode') ? '#0ea5e9' : '#8b5cf6');
      const dot = document.getElementById('cursor-dot');
      if (dot) { dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px'; }
    });

    function animate() {
      ctx.clearRect(0, 0, sparkCanvas.width, sparkCanvas.height);
      for (let i = 0; i < sparks.length; i++) {
        let s = sparks[i]; s.x += s.speedX; s.y += s.speedY; s.opacity -= 0.05;
        ctx.fillStyle = s.color; ctx.globalAlpha = s.opacity;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
        if (s.opacity <= 0) { sparks.splice(i, 1); i--; }
      }
      requestAnimationFrame(animate);
    }
    animate();

    /* ========== APP LOGIC (FROM APP.JS) ========== */
    const SUPABASE_URL = 'https://odyrnnzcixwnpcirtaad.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_BFWtCpz_nUWiixMnbjGObQ_ApM9I20l';
    let dbClient = (typeof supabase !== 'undefined') ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const DEFAULT_DATA = {
      personal: { name: 'ชื่อ-นามสกุล', title: 'Position', university: 'University', bio: 'Bio', avatar: '', skills: ['HTML', 'CSS', 'JS'], contact: { email: '', github: '', linkedin: '', website: '' } },
      experience: { production: [], competition: [], academic: [], personal: [], opensource: [] },
      selfDev: { certs: [], workshops: [] },
      awards: { competitions: [], honors: [] },
      leadership: []
    };
    let data = JSON.parse(JSON.stringify(DEFAULT_DATA));
    let editMode = false, currentTab = 'production', currentSection = 'home';

    const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.style.transform = 'translateY(0)'; setTimeout(() => t.style.transform = 'translateY(200%)', 2500); };
    const save = async () => {
      localStorage.setItem('portfolio', JSON.stringify(data));
      if (dbClient) await dbClient.from('Portfolio_data').upsert({ id: 'main_portfolio', content: data });
    };

    async function loadData() {
      const local = localStorage.getItem('portfolio'); if (local) data = JSON.parse(local);
      if (dbClient) {
        const { data: db } = await dbClient.from('Portfolio_data').select('content').eq('id', 'main_portfolio').single();
        if (db?.content) data = db.content;
      }
      renderAll();
    }

    function showSection(id) {
      currentSection = id;
      document.querySelectorAll('.section-page').forEach(s => s.classList.toggle('active', s.id === id));
      document.querySelectorAll('.nav-links a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === `#${id}`));
      renderAll();
    }

    function renderHero() {
      const p = data.personal, c = p.contact;
      const avatarCont = document.getElementById('heroAvatarContainer');
      if (avatarCont) {
          avatarCont.innerHTML = p.avatar ? `<img class="hero-avatar" src="${esc(p.avatar)}">` : `<div class="hero-avatar" style="display:flex;align-items:center;justify-content:center;background:linear-gradient(45deg, var(--primary), var(--cyan));font-size:4rem;color:#fff;font-weight:900;">${(p.name||'U')[0]}</div>`;
      }
      document.getElementById('heroName').textContent = p.name;
      document.getElementById('heroTitle').textContent = p.title;
      document.getElementById('heroUni').textContent = p.university;
      document.getElementById('heroBio').textContent = p.bio;
      document.getElementById('heroSkills').innerHTML = (p.skills || []).map(s => `<span class="skill-tag">${esc(s)}</span>`).join('');
      
      const linksCont = document.getElementById('heroLinks');
      if (linksCont) {
        const links = [
          { key: 'email', icon: '✉️', label: 'Email', url: `mailto:${c.email}` },
          { key: 'github', icon: '⌥', label: 'GitHub', url: c.github },
          { key: 'linkedin', icon: 'in', label: 'LinkedIn', url: c.linkedin },
          { key: 'website', icon: '🌐', label: 'Website', url: c.website }
        ].filter(l => c[l.key]);
        linksCont.innerHTML = links.map(l => `<a href="${esc(l.url)}" target="_blank" class="${l.key === 'email' ? 'email-cta' : 'social-icon'}">${l.key === 'email' ? `<span style="margin-right:8px">${l.icon}</span>${l.label}` : l.icon}</a>`).join('');
      }
    }

    function renderProjects() {
      const arr = data.experience[currentTab] || [];
      const container = document.getElementById('projectsGrid');
      if (!container) return;
      container.innerHTML = arr.map(p => `
          <div class="project-card">
              ${p.img ? `<img class="project-img-circle" src="${esc(p.img)}">` : `<div class="project-img-circle" style="display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.05)">📁</div>`}
              <div class="project-content" style="width:100% !important; display:flex !important; flex-direction:column !important; align-items:center !important; text-align:center !important;">
                  <h3 style="margin:0; font-size:1.5rem; font-weight:900; color:#fff; text-align:center !important; width:100% !important;">${esc(p.name)}</h3>
                  <div style="margin:0.5rem 0; opacity:0.6; font-size:0.95rem; font-weight:700; text-align:center !important; width:100% !important;">${esc(p.year)}</div>
                  <span class="project-role" style="color:var(--cyan); font-weight:900; font-size:0.9rem; display:block; margin-bottom:1rem; text-transform:uppercase; letter-spacing:2px; text-align:center !important; width:100% !important;">${esc(p.role)}</span>
                  <p class="project-desc" style="color:rgba(255,255,255,0.8); font-size:1rem; line-height:1.7; max-width:100% !important; text-align:center !important; margin: 0 auto !important;">${esc(p.description)}</p>
                  <div class="card-actions" style="margin-top:2rem; display:flex; justify-content:center; width:100%;">
                      ${p.link ? `<a href="${esc(p.link)}" target="_blank" class="email-cta" style="padding:0.7rem 2rem; font-size:0.9rem;">View Result ↗</a>` : ''}
                      ${editMode ? `<button onclick="openEditProject('${p.id}')" style="margin-left:1.5rem; background:none; border:none; color:var(--primary); cursor:pointer; font-weight:900; font-size:1rem;">✏ Edit</button>` : ''}
                  </div>
              </div>
          </div>`).join('');
    }

    function renderAll() {
      renderHero();
      const tabs = document.getElementById('expTabs');
      if (tabs) {
        const tabList = [['production', '🏢 Production'], ['competition', '🏅 Competition'], ['academic', '🎓 Academic'], ['personal', '💡 Personal'], ['opensource', '🔓 Open Source']];
        tabs.innerHTML = tabList.map(([k, l]) => `<button class="tab-btn${currentTab === k ? ' active' : ''}" style="padding:0.8rem 1.5rem; border-radius:100px; border:none; background:${currentTab === k ? 'var(--primary)' : 'rgba(255,255,255,0.05)'}; color:#fff; cursor:pointer; font-weight:700; font-size:0.8rem;" onclick="switchTab('${k}')">${l}</button>`).join('');
      }
      renderProjects();
      
      // Render other sections
      document.getElementById('certsGrid').innerHTML = (data.selfDev.certs || []).map(i => `<div class="item-row-card"><strong>${esc(i.name)}</strong></div>`).join('');
      document.getElementById('competitionsGrid').innerHTML = (data.awards.competitions || []).map(i => `<div class="item-row-card"><strong>${esc(i.name)}</strong></div>`).join('');
      document.getElementById('leadershipGrid').innerHTML = (data.leadership || []).map(i => `<div class="activity-card"><strong>${esc(i.name)}</strong></div>`).join('');
    }

    function switchTab(t) { currentTab = t; renderAll(); }

    document.addEventListener('dblclick', (e) => { if (e.target.innerText === 'CSS') toggleEditMode(); });
    function toggleEditMode() {
      const pw = prompt("Password:");
      if (pw === "1234") { editMode = !editMode; document.getElementById('editBar').style.display = editMode ? 'flex' : 'none'; renderAll(); }
    }
    function toggleTheme() { 
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      localStorage.setItem('portfolio_theme', isLight ? 'light' : 'dark');
      renderAll();
    }
    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    window.onload = loadData;
  </script>
</body>

</html>
