<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio (V3 - Final)</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ========== INTERNAL STYLES (FROM STYLE.CSS) ========== */
    :root {
      --bg-color: #020205;
      --bg-image: radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(34, 211, 238, 0.1) 0%, transparent 50%),
        radial-gradient(1.5px 1.5px at 100px 100px, #fff, rgba(0, 0, 0, 0)),
        radial-gradient(2px 2px at 200px 300px, #fff, rgba(0, 0, 0, 0));
      --text-color: #ffffff;
      --card-bg: rgba(20, 20, 35, 0.5);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary: #8b5cf6;
      --cyan: #0ea5e9;
      --primary-glow: rgba(139, 92, 246, 0.4);
    }

    body.light-mode {
      --bg-color: #f1f5f9;
      --text-color: #0f172a;
      --text-dim: #475569;
      --card-bg: rgba(255, 255, 255, 0.9);
      --border-color: rgba(0, 0, 0, 0.05);
      --primary: #0ea5e9;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #020205 !important;
      background-attachment: fixed;
      background-size: 100% 100%;
      color: var(--text-color);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .shooting-star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 15px 3px #fff, 0 0 25px 6px var(--primary);
      opacity: 0;
      z-index: 1;
      animation: shoot 4s linear infinite;
    }

    .shooting-star::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 150px;
      height: 2px;
      background: linear-gradient(to right, #fff, transparent);
    }

    @keyframes shoot {
      0% {
        transform: translate(0, 0) rotate(-45deg);
        opacity: 0;
      }

      5% {
        opacity: 1;
      }

      15% {
        transform: translate(-600px, 600px) rotate(-45deg);
        opacity: 0;
      }

      100% {
        transform: translate(-600px, 600px) rotate(-45deg);
        opacity: 0;
      }
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem;
      position: relative;
      z-index: 10;
    }

    .section-header-pro {
      text-align: center;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      background: transparent !important;
      opacity: 1 !important;
      visibility: visible !important;
    }

    .section-header-pro h2 {
      font-size: 2.8rem;
      font-weight: 900;
      margin: 0;
      padding: 0;
      line-height: 1.2;
      background: linear-gradient(to right, #ffffff, var(--cyan)) !important;
      -webkit-background-clip: text !important;
      background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      color: transparent !important;
      opacity: 1 !important;
      visibility: visible !important;
    }

    .section-header-pro .line {
      width: 80px;
      height: 4px;
      background: linear-gradient(to right, var(--primary), var(--cyan));
      border-radius: 10px;
      margin-top: 1rem;
      opacity: 1 !important;
    }

    .navbar {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      width: fit-content;
      min-width: 320px;
      height: 60px;
      padding: 0.5rem;
      background: rgba(10, 10, 20, 0.7);
      backdrop-filter: blur(25px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.6rem 1.2rem;
      border-radius: 100px;
      transition: 0.3s;
    }

    .nav-links a.active {
      color: #fff;
      background: var(--primary);
    }

    #heroName {
      font-size: 4rem;
      font-weight: 900;
      background: linear-gradient(to right, #fff, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-card-premium {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      padding: 4rem;
      display: flex;
      align-items: center;
      gap: 4rem;
      margin-bottom: 3rem;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.4);
    }

    .hero-avatar {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .skill-tag {
      padding: 0.5rem 1.2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      transition: 0.3s;
    }

    .skill-tag:hover {
      background: var(--primary);
      transform: translateY(-3px);
    }

    .section-page {
      display: none;
      opacity: 0;
      padding-top: 120px;
      min-height: 100vh;
      transition: 0.5s;
    }

    .section-page.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .projects-grid,
    #certsGrid,
    #workshopsGrid,
    #competitionsGrid,
    #leadershipGrid {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      max-width: 800px;
      margin: 0 auto;
    }

    .project-card,
    .activity-card,
    .item-row-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: 0.3s;
    }

    .project-card:hover {
      transform: translateY(-10px);
      border-color: var(--primary);
    }

    .project-img-circle,
    .activity-img,
    .item-img-mini {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--primary);
      margin-bottom: 1rem;
    }

    #spark-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100000;
    }

    #cursor-dot {
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 100001;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px var(--primary);
    }

    /* Edit Mode UI */
    .edit-bar {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 20, 0.9);
      padding: 0.8rem 2rem;
      border-radius: 100px;
      display: none;
      gap: 1.5rem;
      border: 1px solid var(--primary);
      z-index: 99999;
      align-items: center;
    }

    .edit-bar button,
    .edit-bar span {
      color: #fff;
      background: transparent;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200000;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: #0d0d1a;
      border: 2px solid var(--primary);
      border-radius: 32px;
      width: 90%;
      max-width: 600px;
      padding: 2rem;
      color: #fff;
    }

    .f-group {
      margin-bottom: 1rem;
    }

    .f-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .f-group input,
    .f-group textarea {
      width: 100%;
      padding: 0.8rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }
  </style>
</head>

<body>
  <canvas id="spark-canvas"></canvas>
  <div class="bg-container">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="shooting-star" style="top: 10%; left: 80%; animation-delay: 0s;"></div>
    <div class="shooting-star" style="top: 30%; left: 90%; animation-delay: 5s;"></div>
    <div class="shooting-star" style="top: 50%; left: 70%; animation-delay: 2s;"></div>
    <div class="shooting-star" style="top: 70%; left: 85%; animation-delay: 8s;"></div>
  </div>
  <div id="cursor-dot"></div>

  <nav class="navbar">
    <div class="nav-links">
      <a href="#home" class="active" onclick="showSection('home'); return false;">Home</a>
      <a href="#experience" onclick="showSection('experience'); return false;">Experience</a>
      <a href="#selfdev" onclick="showSection('selfdev'); return false;">Skills</a>
      <a href="#awards" onclick="showSection('awards'); return false;">Awards</a>
      <a href="#leadership" onclick="showSection('leadership'); return false;">Leadership</a>
    </div>
    <button class="btn-edit-toggle" onclick="toggleTheme()"
      style="background:transparent; border:none; color:#fff; cursor:pointer; margin-left:1rem; font-size:1.2rem;">🌓</button>
  </nav>

  <!-- SECTIONS -->
  <section class="hero section-page active" id="home">
    <div class="container">
      <div class="hero-card-premium">
        <div id="heroAvatarContainer"></div>
        <div class="hero-info-box">
          <p id="heroTitle" style="color:var(--cyan); font-family:'JetBrains Mono'; font-weight:700;"></p>
          <h1 id="heroName"></h1>
          <p id="heroUni" style="color:rgba(255,255,255,0.6); margin-bottom:1rem;"></p>
          <div id="heroSkills" style="display:flex; gap:0.5rem; margin-bottom:1.5rem; flex-wrap:wrap;"></div>
          <p id="heroBio" style="line-height:1.8; color:rgba(255,255,255,0.8);"></p>
          <div id="heroLinks" style="display:flex; gap:1rem; margin-top:2rem;"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section section-page" id="experience">
    <div class="container">
      <div class="section-header-pro"><span class="label">01</span>
        <h2>Experience</h2>
        <div class="line"></div>
      </div>
      <div id="expTabs" class="exp-tabs" style="display:flex; justify-content:center; gap:1rem; margin-bottom:2rem;">
      </div>
      <div class="projects-grid" id="projectsGrid"></div>
    </div>
  </section>

  <section class="section section-page" id="selfdev">
    <div class="container">
      <div class="section-header-pro"><span class="label">02</span>
        <h2>Skills & Development</h2>
        <div class="line"></div>
      </div>
      <div id="certsGrid"></div>
      <div id="workshopsGrid" style="margin-top:2rem;"></div>
    </div>
  </section>

  <section class="section section-page" id="awards">
    <div class="container">
      <div class="section-header-pro"><span class="label">03</span>
        <h2>Awards</h2>
        <div class="line"></div>
      </div>
      <div id="competitionsGrid"></div>
    </div>
  </section>

  <section class="section section-page" id="leadership">
    <div class="container">
      <div class="section-header-pro"><span class="label">04</span>
        <h2>Leadership</h2>
        <div class="line"></div>
      </div>
      <div id="leadershipGrid"></div>
    </div>
  </section>

  <div class="edit-bar" id="editBar">
    <span id="visitorCount">📊 Visits: ...</span>
    <button onclick="exportData()">Export JSON</button>
    <button onclick="toggleEditMode()">🔒 Close</button>
  </div>

  <!-- MODAL -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Edit</h3>
      <div id="modalFields"></div>
      <div style="display:flex; gap:1rem; margin-top:2rem;">
        <button onclick="closeModal()"
          style="flex:1; padding:0.8rem; border-radius:12px; background:rgba(255,255,255,0.1); color:#fff; border:none;">Cancel</button>
        <button id="modalSaveBtn"
          style="flex:1; padding:0.8rem; border-radius:12px; background:var(--primary); color:#fff; border:none;">Save</button>
      </div>
    </div>
  </div>

  <div id="toast"
    style="position:fixed; bottom:2rem; right:2rem; background:var(--primary); color:white; padding:1rem 2rem; border-radius:10px; transform:translateY(200%); transition:0.3s; z-index:999999;">
  </div>

  <script>
    /* ========== MOUSE & SPARK LOGIC (REFINED) ========== */
    const sparkCanvas = document.getElementById('spark-canvas');
    const ctx = sparkCanvas.getContext('2d');
    let sparks = [];
    function resize() { sparkCanvas.width = window.innerWidth; sparkCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    function createSpark(x, y, color) {
      sparks.push({
        x, y, size: Math.random() * 1.5 + 0.5,
        speedX: (Math.random() - 0.5) * 1, speedY: (Math.random() - 0.5) * 1,
        opacity: 0.8, color: color || '#0ea5e9'
      });
    }

    document.addEventListener('mousemove', (e) => {
      createSpark(e.clientX, e.clientY, document.body.classList.contains('light-mode') ? '#0ea5e9' : '#8b5cf6');
      const dot = document.getElementById('cursor-dot');
      if (dot) { dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px'; }
    });

    function animate() {
      ctx.clearRect(0, 0, sparkCanvas.width, sparkCanvas.height);
      for (let i = 0; i < sparks.length; i++) {
        let s = sparks[i]; s.x += s.speedX; s.y += s.speedY; s.opacity -= 0.05;
        ctx.fillStyle = s.color; ctx.globalAlpha = s.opacity;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
        if (s.opacity <= 0) { sparks.splice(i, 1); i--; }
      }
      requestAnimationFrame(animate);
    }
    animate();

    /* ========== APP LOGIC (FROM APP.JS) ========== */
    const SUPABASE_URL = 'https://odyrnnzcixwnpcirtaad.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_BFWtCpz_nUWiixMnbjGObQ_ApM9I20l';
    let dbClient = (typeof supabase !== 'undefined') ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const DEFAULT_DATA = {
      personal: { name: 'ชื่อ-นามสกุล', title: 'Position', university: 'University', bio: 'Bio', avatar: '', skills: ['HTML', 'CSS', 'JS'], contact: { email: '', github: '', linkedin: '', website: '' } },
      experience: { production: [], competition: [], academic: [], personal: [], opensource: [] },
      selfDev: { certs: [], workshops: [] },
      awards: { competitions: [], honors: [] },
      leadership: []
    };
    let data = JSON.parse(JSON.stringify(DEFAULT_DATA));
    let editMode = false, currentTab = 'production', currentSection = 'home';

    const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.style.transform = 'translateY(0)'; setTimeout(() => t.style.transform = 'translateY(200%)', 2500); };
    const save = async () => {
      localStorage.setItem('portfolio', JSON.stringify(data));
      if (dbClient) await dbClient.from('Portfolio_data').upsert({ id: 'main_portfolio', content: data });
    };

    async function loadData() {
      const local = localStorage.getItem('portfolio'); if (local) data = JSON.parse(local);
      if (dbClient) {
        const { data: db } = await dbClient.from('Portfolio_data').select('content').eq('id', 'main_portfolio').single();
        if (db?.content) data = db.content;
      }
      renderAll();
    }

    function showSection(id) {
      currentSection = id;
      document.querySelectorAll('.section-page').forEach(s => s.classList.toggle('active', s.id === id));
      document.querySelectorAll('.nav-links a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === `#${id}`));
      renderAll();
    }

    function renderHero() {
      const p = data.personal;
      document.getElementById('heroAvatarContainer').innerHTML = p.avatar ? `<img class="hero-avatar" src="${esc(p.avatar)}">` : `<div class="hero-avatar" style="display:flex;align-items:center;justify-content:center;background:var(--primary);font-size:4rem;color:#fff;">${(p.name || 'U')[0]}</div>`;
      document.getElementById('heroName').textContent = p.name;
      document.getElementById('heroTitle').textContent = p.title;
      document.getElementById('heroUni').textContent = p.university;
      document.getElementById('heroBio').textContent = p.bio;
      document.getElementById('heroSkills').innerHTML = (p.skills || []).map(s => `<span class="skill-tag">${esc(s)}</span>`).join('');
    }

    function renderAll() {
      renderHero();
      const projects = data.experience[currentTab] || [];
      document.getElementById('projectsGrid').innerHTML = projects.map(p => `
            <div class="project-card">
                <img class="project-img-circle" src="${p.img || ''}">
                <h3>${esc(p.name)}</h3>
                <p>${esc(p.description)}</p>
            </div>`).join('');
      // Simplified other renders for brevity in bundle
      document.getElementById('certsGrid').innerHTML = (data.selfDev.certs || []).map(c => `<div class="item-row-card"><strong>${esc(c.name)}</strong></div>`).join('');
      document.getElementById('competitionsGrid').innerHTML = (data.awards.competitions || []).map(a => `<div class="item-row-card"><strong>${esc(a.name)}</strong></div>`).join('');
      document.getElementById('leadershipGrid').innerHTML = (data.leadership || []).map(l => `<div class="activity-card"><strong>${esc(l.name)}</strong></div>`).join('');
    }

    document.addEventListener('dblclick', (e) => { if (e.target.innerText === 'CSS') toggleEditMode(); });
    function toggleEditMode() {
      const pw = prompt("Password:");
      if (pw === "1234") { editMode = !editMode; document.getElementById('editBar').style.display = editMode ? 'flex' : 'none'; renderAll(); }
    }
    function toggleTheme() { document.body.classList.toggle('light-mode'); }
    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    window.onload = loadData;
  </script>
</body>

</html>
